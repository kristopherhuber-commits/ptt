# Tooling configuration only.
#
# There is deliberately no [build-system]. This project ships a portable Python
# environment built by build_portable.py, not a wheel (CON-2), so it is never
# pip-installed and `import ptt` resolves straight from the source tree.

[project]
name = "ptt-dictate"
version = "0.1.0"
description = "Push-to-talk local GPU dictation for Windows 11"
requires-python = ">=3.14"

[tool.pytest.ini_options]
# The package lives at app/ptt/, so app/ must be importable for `import ptt` to
# resolve without installing anything (docs/design.md section 8).
pythonpath = ["app"]
testpaths = ["tests"]

[tool.pyrefly]
python-interpreter = ".venv/Scripts/python.exe"
# Same reason as pytest's pythonpath above: the import root pyrefly infers from
# the project layout is the repo root, where `ptt` is not visible.
search-path = ["app"]
project-includes = ["app", "*.py"]
